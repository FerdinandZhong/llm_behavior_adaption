# Production configuration for scam adaptation with Llama-3.1-8B-Instruct
# Tests full dataset on career questions

# Dataset paths
user_profile_dataset_path: "datasets/wvs_benchmarks/sampled_demographic_features.csv"
picked_questions_path: "datasets/wvs_benchmarks/picked_questions.json"
human_results_path: "datasets/wvs_benchmarks/sampled_values_df.csv"

# Output path
output_file_path: "wvs_values_results/Llama-3.1-8B-Instruct/scam_adaptation/career/results.jsonl"

# Prompts folder
prompts_folder: "llm_behavior_adaptation/value_measurement/prompts"

# Model configuration
evaluated_model: "meta-llama/llama-3.1-8b-instruct"
llm_server: "llm_platform"
model_base_url: "https://openrouter.ai/api/v1"

# Run on all users
starting_row: 680
ending_row: -1

# Storage step for periodic saves
storage_step: 10

# Concurrent API requests (adjust based on API rate limits)
# Recommended values:
#   - 10-20: Conservative (1-2 req/sec typical)
#   - 25-50: Moderate (2-5 req/sec typical)
#   - 50+:   Aggressive (5+ req/sec, monitor for rate limits)
max_concurrent_requests: 50

# Verbose logging
verbose: 1

# Reasoning disabled for faster processing
reasoning: false

# Extra API parameters
extra_body:
  provider:
    only:
      - novita/fp8
      - nebius/fast
