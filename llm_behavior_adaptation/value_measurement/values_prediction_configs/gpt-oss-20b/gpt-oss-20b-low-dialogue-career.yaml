picked_questions_path: "datasets/wvs_benchmarks/picked_questions.json"
evaluated_model: openai/gpt-oss-20b
direct_output_file_path: ignore
dialogue_output_file_path: wvs_values_results/gpt-oss-20b-low/career/BA_dialogue_values_results/new_total_1000.jsonl
