# Expected YAML keys:
user_profile_dataset_path: "datasets/wvs_benchmarks/sampled_demographic_features.csv"
dialogue_file: "datasets/wvs_generated_dialogues/investment_advice/all_samples.jsonl"
picked_questions_path: "datasets/wvs_benchmarks/picked_questions.json"
evaluated_model: openai/gpt-oss-20b
direct_output_file_path: wvs_values_results/gpt-oss-20b-high/BA_user_values_results/total_1000.jsonl
dialogue_output_file_path: ignore
prompts_folder: llm_behavior_adaptation/value_measurement/prompts
# Optional:
starting_row: 30
ending_row: 1000
llm_server: llm_platform
verbose: 1
storage_step: 2
reasoning: true
model_base_url: https://openrouter.ai/api/v1
run_mode: profiles
extra_body:
  reasoning: 
    effort: "high"
  provider:
    only:
      # - deepinfra/fp4
      # - inference-net
      # - novita/bf16
      - google-vertex